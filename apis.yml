name: Eventtus
description: >-
  Eventtus was a Cairo, Egypt-based event technology company that built a mobile
  event app and attendee-engagement platform for conferences, trade shows, and
  community events. Its product offered event apps with agendas, networking and
  matchmaking, live Q&A and polls, push notifications, social feeds, lead
  capture, badge printing, online registration, and organizer analytics. Founded
  by Mai Medhat and Nihal Fares, Eventtus raised venture funding from investors
  including 500 Startups (500 Global), Vodafone Ventures, and Endure Capital, and
  was acquired by the community-events platform Bevy in July 2021. This profile
  was surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network. Enrichment found no live public API, developer portal, or
  first-party SDK — the eventtus.com domain no longer resolves and the
  engineering blog is offline — so the profile is retained as identity only.
